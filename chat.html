<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM.AI — Chat</title>
    <meta name="description"
        content="Chat with QUANTUM.AI — get instant answers to your coding questions with clear explanations and working code snippets.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛</text></svg>">
</head>

<body>
    <div class="chat-layout">

        <!-- Sidebar -->
        <aside class="chat-sidebar" id="chatSidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">⚛</div>
                    <span>QUANTUM<span class="glow-text">.AI</span></span>
                </div>
                <button class="new-chat-btn" id="newChatBtn" aria-label="Start new chat">
                    ✦ New Chat
                </button>
            </div>

            <div class="sidebar-chats" id="sidebarChats">
                <!-- Chat history items will be injected by JS -->
            </div>

            <div class="sidebar-footer">
                <a href="index.html" class="sidebar-home-link">
                    ← Back to Home
                </a>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="chat-header-info">
                    <button class="mobile-sidebar-toggle" id="mobileSidebarToggle" aria-label="Toggle sidebar">
                        ☰
                    </button>
                    <h1 class="chat-header-title">QUANTUM.AI</h1>
                    <div class="chat-header-status">
                        <span class="status-dot"></span>
                        Online
                    </div>
                </div>
            </header>

            <!-- Messages -->
            <div class="chat-messages" id="chatMessages">
                <!-- Welcome Screen (shown when no messages) -->
                <div class="chat-welcome" id="chatWelcome">
                    <div class="welcome-icon">⚛</div>
                    <h2 class="welcome-title">Hi, I'm <span class="glow-text">QUANTUM.AI</span></h2>
                    <p class="welcome-subtitle">I'm here to help you with your coding questions. Try one of these to get
                        started:</p>
                    <div class="welcome-suggestions" id="welcomeSuggestions">
                        <button class="suggestion-chip" data-query="How do I write a for loop in Python?">
                            <div class="suggestion-chip-icon">🐍</div>
                            How do I write a for loop in Python?
                        </button>
                        <button class="suggestion-chip" data-query="What is async/await in JavaScript?">
                            <div class="suggestion-chip-icon">⚡</div>
                            What is async/await in JavaScript?
                        </button>
                        <button class="suggestion-chip" data-query="How do I center a div in CSS?">
                            <div class="suggestion-chip-icon">🎨</div>
                            How do I center a div in CSS?
                        </button>
                        <button class="suggestion-chip" data-query="What is a SQL JOIN?">
                            <div class="suggestion-chip-icon">🗃️</div>
                            What is a SQL JOIN?
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Ask me a coding question..."
                        maxlength="500" autocomplete="off">
                    <span class="chat-char-count" id="charCount">0/500</span>
                    <button class="chat-send-btn" id="sendBtn" disabled aria-label="Send message">
                        ➤
                    </button>
                </div>
                <p class="chat-disclaimer">QUANTUM.AI V1 — Independent AI by Antigravity. No external APIs.</p>
            </div>
        </main>
    </div>

    <!-- Sidebar overlay for mobile -->
    <div id="sidebarOverlay" style="
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);
    z-index:50;
  "></div>

    <script src="js/chat.js"></script>
</body>

</html>
